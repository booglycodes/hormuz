<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SuperMashBruddas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #080b12;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="2000" height="1100"></canvas>

    <!-- game engine -->
    <script type="text/javascript" src="drawing.js"></script>
    <script type="text/javascript" src="physics.js"></script>
    <script type="text/javascript" src="skin.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="attack.js"></script>
    <script type="text/javascript" src="player.js"></script>

    <!-- characters -->
    <script type="text/javascript" src="trump.js"></script>
    <script type="text/javascript" src="stoner.js"></script>
    <script type="text/javascript" src="faceman.js"></script>
    <script type="text/javascript" src="physics_knigh.js"></script>
    <script type="text/javascript" src="utopian.js"></script>
    <script type="text/javascript" src="shrek.js"></script>
    <script type="text/javascript" src="monke.js"></script>

    <!-- networking & state machine -->
    <script type="text/javascript" src="network.js"></script>

    <!-- game logic -->
    <script type="text/javascript" src="game.js"></script>

    <!-- host UI rendering -->
    <script type="module">
        import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm"

        // Load character images for select screen
        const charImages = {}
        const charImgSrcs = {
            trump: 'images/trump.png',
            stoner: 'images/stoner.png',
            faceman: 'images/faceman.png',
            knigh: 'images/knight.png',
            utopian: 'images/utopian.png',
            shrek: 'images/shrek.png',
            monke: 'images/monke.png'
        }
        for (const [name, src] of Object.entries(charImgSrcs)) {
            const img = new Image()
            img.src = src
            charImages[name] = img
        }

        let qrImg = null

        window.addEventListener('load', async () => {
            const roomName = await initNetwork()

            // Generate QR
            const url = getQRUrl(roomName)
            console.log("[hormuz] Join URL:", url)
            const dataUrl = await QRCode.toDataURL(url, { width: 400, margin: 1 })
            qrImg = new Image()
            qrImg.src = dataUrl

            // Start host render loop
            requestAnimationFrame(hostRender)
        })

        function hostRender() {
            checkGameoverTimeout()

            if (gamePhase === PHASE_PLAYING) {
                // game.js handles rendering during play
                requestAnimationFrame(hostRender)
                return
            }

            ctx.fillStyle = "#080b12"
            ctx.fillRect(0, 0, canvas.width, canvas.height)

            if (gamePhase === PHASE_LOBBY) {
                drawLobby()
            } else if (gamePhase === PHASE_SELECT) {
                drawSelect()
            } else if (gamePhase === PHASE_GAMEOVER) {
                drawGameover()
            }

            requestAnimationFrame(hostRender)
        }

        function drawLobby() {
            const cx = canvas.width / 2
            const cy = canvas.height / 2

            // Title
            ctx.fillStyle = "white"
            ctx.font = "bold 80px system-ui"
            ctx.textAlign = "center"
            ctx.fillText("SUPER MASH BRUDDAS", cx, 120)

            // QR code
            if (qrImg && qrImg.complete) {
                const qrSize = 300
                ctx.drawImage(qrImg, cx - qrSize / 2, cy - qrSize / 2 - 30, qrSize, qrSize)
            }

            // "Scan to join"
            ctx.fillStyle = "#9ca3af"
            ctx.font = "36px system-ui"
            ctx.fillText("Scan to join", cx, cy + 200)

            // Connected players
            ctx.font = "30px system-ui"
            ctx.fillStyle = "#22c55e"
            ctx.fillText(`${connectedPeers.length} player(s) connected`, cx, cy + 260)

            // Auto-advance to select when players connected
            if (connectedPeers.length > 0) {
                ctx.fillStyle = "#64748b"
                ctx.font = "24px system-ui"
                ctx.fillText("Waiting for more players... Game starts from character select", cx, cy + 320)

                // Show "start" hint — auto go to select after 2+ players or any player
                if (connectedPeers.length >= 1) {
                    startSelectPhase()
                }
            }
        }

        function drawSelect() {
            const cx = canvas.width / 2

            ctx.fillStyle = "white"
            ctx.font = "bold 60px system-ui"
            ctx.textAlign = "center"
            ctx.fillText("SELECT YOUR CHARACTER", cx, 80)

            // Draw character roster
            const chars = character_names_list
            const cols = chars.length
            const cellW = 220
            const cellH = 260
            const startX = cx - (cols * cellW) / 2
            const startY = 150

            for (let i = 0; i < chars.length; i++) {
                const x = startX + i * cellW
                const y = startY

                // Highlight if any player is browsing/locked on this
                let selectedBy = []
                for (const peer of connectedPeers) {
                    if (peer.selectedChar === chars[i]) {
                        selectedBy.push(peer)
                    }
                }

                // Cell background
                ctx.fillStyle = selectedBy.length > 0 ? "#1e293b" : "#0f172a"
                ctx.strokeStyle = selectedBy.some(p => p.locked) ? "#22c55e" : selectedBy.length > 0 ? "#3b82f6" : "#293244"
                ctx.lineWidth = selectedBy.some(p => p.locked) ? 4 : 2
                ctx.beginPath()
                ctx.roundRect(x + 10, y, cellW - 20, cellH, 12)
                ctx.fill()
                ctx.stroke()

                // Character image
                const img = charImages[chars[i]]
                if (img && img.complete) {
                    ctx.drawImage(img, x + 35, y + 20, cellW - 70, cellH - 80)
                }

                // Name
                ctx.fillStyle = "white"
                ctx.font = "bold 20px system-ui"
                ctx.fillText(chars[i].toUpperCase(), x + cellW / 2, y + cellH - 20)
            }

            // Player status
            const statusY = startY + cellH + 60
            ctx.font = "28px system-ui"
            for (let i = 0; i < connectedPeers.length; i++) {
                const peer = connectedPeers[i]
                const label = peer.locked ? "✓ LOCKED" : "choosing..."
                const color = peer.locked ? "#22c55e" : "#9ca3af"
                ctx.fillStyle = color
                ctx.fillText(
                    `P${i + 1}: ${peer.selectedChar.toUpperCase()} ${label}`,
                    cx, statusY + i * 40
                )
            }

            // QR still visible (smaller, corner)
            if (qrImg && qrImg.complete) {
                ctx.drawImage(qrImg, canvas.width - 170, canvas.height - 170, 150, 150)
                ctx.fillStyle = "#64748b"
                ctx.font = "14px system-ui"
                ctx.fillText("Scan to join", canvas.width - 95, canvas.height - 12)
            }
        }

        function drawGameover() {
            const cx = canvas.width / 2
            const cy = canvas.height / 2

            ctx.fillStyle = "white"
            ctx.font = "bold 100px system-ui"
            ctx.textAlign = "center"
            ctx.fillText((winnerName || "???").toUpperCase() + " WINS!", cx, cy)

            const elapsed = performance.now() - gameoverTimer
            const remaining = Math.max(0, Math.ceil((GAMEOVER_DURATION - elapsed) / 1000))
            ctx.fillStyle = "#9ca3af"
            ctx.font = "36px system-ui"
            ctx.fillText(`Next round in ${remaining}...`, cx, cy + 80)
        }
    </script>
</body>
