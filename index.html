<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Trystero WASD Game</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #080b12;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* === HOST UI === */
    #host-ui {
      width: min(900px, 94vw);
      padding: 18px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #status {
      color: #9ca3af;
      font-size: 14px;
      margin-right: auto;
    }

    input, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid #303746;
    }

    input {
      width: 150px;
      padding: 9px 11px;
      background: #151a24;
      color: white;
      outline: none;
    }

    button {
      padding: 9px 14px;
      color: white;
      background: #2563eb;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: default; }

    #game {
      position: relative;
      width: min(900px, 94vw);
      aspect-ratio: 16 / 9;
      background-color: #0f172a;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      border: 2px solid #293244;
      border-radius: 12px;
      overflow: hidden;
    }

    #qr-container {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: white;
      padding: 8px;
      border-radius: 8px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    #qr-container canvas {
      display: block;
    }

    #qr-label {
      font-size: 11px;
      color: #333;
      text-align: center;
    }

    .player {
      position: absolute;
      width: 32px;
      height: 32px;
      transform: translate(-50%, -50%);
      border-radius: 6px;
      pointer-events: none;
      will-change: left, top;
    }

    .player-label {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      margin-bottom: 5px;
      font-size: 10px;
      color: #d1d5db;
      white-space: nowrap;
      user-select: none;
    }

    #help {
      margin-top: 10px;
      color: #64748b;
      font-size: 13px;
    }

    /* === CLIENT (MOBILE) UI === */
    #client-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      gap: 20px;
    }

    #client-status {
      font-size: 16px;
      color: #9ca3af;
    }

    #joystick-area {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      touch-action: none;
    }

    #joystick-base {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px solid #475569;
    }

    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
      transition: box-shadow 0.1s;
    }

    #joystick-knob.active {
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.8);
    }

    /* Join screen for mobile */
    #join-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 30px;
      gap: 16px;
    }

    #join-screen h2 {
      margin: 0;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <!-- HOST VIEW (PC) -->
  <div id="host-view">
    <div id="host-ui">
      <div id="status">Click "Host Game" to start</div>
      <button id="hostButton">Host Game</button>
    </div>
    <div id="game">
      <div id="qr-container">
        <canvas id="qr-canvas"></canvas>
        <div id="qr-label">Scan to join</div>
      </div>
    </div>
    <div id="help">Players join by scanning the QR code</div>
  </div>

  <!-- CLIENT CONNECTING SCREEN (MOBILE) -->
  <div id="join-screen">
    <h2>Connecting...</h2>
  </div>

  <!-- CLIENT JOYSTICK VIEW (MOBILE) -->
  <div id="client-screen">
    <div id="client-status">Connected</div>
    <div id="joystick-area">
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
    </div>
  </div>

  <script type="module">
    console.log("[hormuz] build 2 — torrent + qr + joystick");

    import { joinRoom } from "https://cdn.jsdelivr.net/npm/trystero@0.22.0/torrent/+esm";
    import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm";

    const APP_ID = "wasd-square-game";
    const WORLD = { width: 900, height: 506 };
    const PLAYER_SIZE = 32;
    const SPEED = 280;
    const STATE_RATE = 33;

    const players = {};
    const remoteInputs = {};
    const playerElements = new Map();

    let room = null;
    let myId = null;
    let sendState = null;

    // Detect if mobile
    const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent)
      || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      return `hsl(${h}, 85%, 55%)`;
    }

    function createPlayer() {
      return {
        x: WORLD.width / 2 + (Math.random() - 0.5) * 150,
        y: WORLD.height / 2 + (Math.random() - 0.5) * 150
      };
    }

    function createPlayerElement(id, gameEl) {
      const element = document.createElement("div");
      element.className = "player";
      const color = stringToColor(id);
      element.style.background = color;
      element.style.boxShadow = `0 0 12px ${color}`;

      const label = document.createElement("div");
      label.className = "player-label";
      label.textContent = id.slice(0, 6);
      element.appendChild(label);
      gameEl.appendChild(element);
      playerElements.set(id, element);
      return element;
    }

    function renderPlayer(id, gameEl) {
      const player = players[id];
      if (!player) return;
      let element = playerElements.get(id);
      if (!element) element = createPlayerElement(id, gameEl);
      element.style.left = `${(player.x / WORLD.width) * 100}%`;
      element.style.top = `${(player.y / WORLD.height) * 100}%`;
    }

    function movePlayer(player, input, dt) {
      let dx = input.dx || 0;
      let dy = input.dy || 0;

      // Also support legacy wasd booleans
      if (input.w) dy -= 1;
      if (input.s) dy += 1;
      if (input.a) dx -= 1;
      if (input.d) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy);
        if (length > 1) { dx /= length; dy /= length; }
      }

      player.x += dx * SPEED * dt;
      player.y += dy * SPEED * dt;

      const half = PLAYER_SIZE / 2;
      player.x = Math.max(half, Math.min(WORLD.width - half, player.x));
      player.y = Math.max(half, Math.min(WORLD.height - half, player.y));
    }

    // ======== HOST MODE ========
    function startHost() {
      const hostView = document.getElementById("host-view");
      const game = document.getElementById("game");
      const status = document.getElementById("status");
      const hostButton = document.getElementById("hostButton");
      const qrContainer = document.getElementById("qr-container");

      const roomName = crypto.randomUUID();

      room = joinRoom({ appId: APP_ID }, roomName);
      myId = room.selfId;

      const [sendInput, receiveInput] = room.makeAction("input");
      const [_sendState, receiveState] = room.makeAction("state");
      sendState = _sendState;
      receiveState(() => {});

      receiveInput((input, peerId) => {
        remoteInputs[peerId] = input;
        if (!players[peerId]) {
          players[peerId] = createPlayer();
        }
      });

      room.onPeerJoin(peerId => {
        players[peerId] = createPlayer();
        remoteInputs[peerId] = { dx: 0, dy: 0 };
        sendState(structuredClone(players));
        status.textContent = `HOST — ${Object.keys(players).length} player(s)`;
      });

      room.onPeerLeave(peerId => {
        delete players[peerId];
        delete remoteInputs[peerId];
        const el = playerElements.get(peerId);
        if (el) { el.remove(); playerElements.delete(peerId); }
        sendState(structuredClone(players));
        status.textContent = `HOST — ${Object.keys(players).length} player(s)`;
      });

      status.textContent = `HOST — ${Object.keys(players).length} player(s)`;
      hostButton.disabled = true;

      // Generate QR code
      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomName)}`;
      const qrCanvas = document.getElementById("qr-canvas");
      QRCode.toCanvas(qrCanvas, joinUrl, {
        width: 140,
        margin: 1,
        color: { dark: "#000000", light: "#ffffff" }
      });
      qrContainer.style.display = "flex";

      // Host game loop (spectator — no local player)
      let lastTime = performance.now();
      let lastBroadcast = performance.now();

      function hostLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;

        for (const id of Object.keys(remoteInputs)) {
          if (!players[id]) continue;
          movePlayer(players[id], remoteInputs[id], dt);
          renderPlayer(id, game);
        }

        // Clean up removed players
        for (const [id, el] of playerElements) {
          if (!players[id]) { el.remove(); playerElements.delete(id); }
        }

        if (now - lastBroadcast >= STATE_RATE) {
          if (sendState) sendState(structuredClone(players));
          lastBroadcast = now;
        }

        requestAnimationFrame(hostLoop);
      }

      requestAnimationFrame(hostLoop);
    }

    // ======== CLIENT MODE (MOBILE) ========
    function startClient(roomName) {
      const joinScreen = document.getElementById("join-screen");
      const clientScreen = document.getElementById("client-screen");
      const clientStatus = document.getElementById("client-status");

      joinScreen.style.display = "none";
      clientScreen.style.display = "flex";

      room = joinRoom({ appId: APP_ID }, roomName);
      myId = room.selfId;

      const [sendInput, receiveInput] = room.makeAction("input");
      receiveInput(() => {});

      const [_sendState, receiveState] = room.makeAction("state");
      receiveState(() => {});

      room.onPeerJoin(() => {
        clientStatus.textContent = "Connected ✓";
      });

      room.onPeerLeave(() => {
        clientStatus.textContent = "Host disconnected";
      });

      clientStatus.textContent = "Connecting...";

      // Joystick logic
      const joystickArea = document.getElementById("joystick-area");
      const knob = document.getElementById("joystick-knob");
      const maxDist = 65;

      let currentInput = { dx: 0, dy: 0 };
      let activeTouch = null;

      function updateKnob(cx, cy) {
        const rect = joystickArea.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = cx - centerX;
        let dy = cy - centerY;
        const dist = Math.hypot(dx, dy);

        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }

        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        knob.classList.add("active");

        currentInput.dx = dx / maxDist;
        currentInput.dy = dy / maxDist;
      }

      function resetKnob() {
        knob.style.transform = "translate(-50%, -50%)";
        knob.classList.remove("active");
        currentInput.dx = 0;
        currentInput.dy = 0;
        activeTouch = null;
      }

      joystickArea.addEventListener("touchstart", e => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        activeTouch = touch.identifier;
        updateKnob(touch.clientX, touch.clientY);
      }, { passive: false });

      joystickArea.addEventListener("touchmove", e => {
        e.preventDefault();
        for (const touch of e.changedTouches) {
          if (touch.identifier === activeTouch) {
            updateKnob(touch.clientX, touch.clientY);
            break;
          }
        }
      }, { passive: false });

      joystickArea.addEventListener("touchend", e => {
        for (const touch of e.changedTouches) {
          if (touch.identifier === activeTouch) {
            resetKnob();
            break;
          }
        }
      });

      joystickArea.addEventListener("touchcancel", () => resetKnob());

      // Send input at regular interval
      setInterval(() => {
        if (sendInput) {
          sendInput({ dx: currentInput.dx, dy: currentInput.dy });
        }
      }, 33);
    }

    // ======== INIT ========
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const roomFromUrl = params.get("room");

      if (isMobile && roomFromUrl) {
        // Mobile with room code: show connecting then join
        document.getElementById("host-view").style.display = "none";
        document.getElementById("join-screen").style.display = "flex";
        startClient(roomFromUrl);
      } else if (isMobile) {
        // Mobile without room code: nothing to join
        document.getElementById("host-view").style.display = "none";
        document.getElementById("join-screen").style.display = "flex";
        document.querySelector("#join-screen h2").textContent = "Scan QR code to join";
      } else {
        // PC: show host view
        document.getElementById("host-view").style.display = "block";
        document.getElementById("hostButton").addEventListener("click", startHost);
      }
    });
  </script>
</body>
</html>
