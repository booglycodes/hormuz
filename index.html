<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SuperMashBruddas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #444;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #qr-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #qr-overlay img { display: block; }
        #qr-label {
            font-family: system-ui, sans-serif;
            font-size: 12px;
            color: #333;
        }
        #player-count {
            position: fixed;
            top: 16px;
            left: 16px;
            font-family: system-ui, sans-serif;
            font-size: 16px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="2000" height="1100"></canvas>
    <div id="qr-overlay">
        <img id="qr-img" width="150" height="150" />
        <div id="qr-label">Scan to join</div>
    </div>
    <div id="player-count">Waiting for players...</div>

    <!-- game engine -->
    <script type="text/javascript" src="drawing.js"></script>
    <script type="text/javascript" src="physics.js"></script>
    <script type="text/javascript" src="skin.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="attack.js"></script>
    <script type="text/javascript" src="player.js"></script>

    <!-- characters -->
    <script type="text/javascript" src="trump.js"></script>
    <script type="text/javascript" src="stoner.js"></script>
    <script type="text/javascript" src="faceman.js"></script>
    <script type="text/javascript" src="physics_knigh.js"></script>
    <script type="text/javascript" src="utopian.js"></script>
    <script type="text/javascript" src="shrek.js"></script>
    <script type="text/javascript" src="monke.js"></script>

    <!-- networking -->
    <script type="text/javascript" src="network.js"></script>

    <!-- run game -->
    <script type="text/javascript" src="game.js"></script>

    <!-- QR code generation (loaded as module) -->
    <script type="module">
        import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm"

        // Wait for hostGame to be available and game to init
        window.addEventListener('load', async () => {
            const roomName = await hostGame(
                // onPlayerJoin
                (peerId, control) => {
                    connecthandler(control)
                    document.getElementById('player-count').textContent =
                        `${players.length} player(s) connected`
                },
                // onPlayerLeave
                (peerId) => {
                    document.getElementById('player-count').textContent =
                        `${players.length} player(s) connected`
                }
            )

            // Generate QR
            const url = getQRUrl(roomName)
            console.log("[hormuz] Join URL:", url)
            const dataUrl = await QRCode.toDataURL(url, { width: 300, margin: 1 })
            document.getElementById('qr-img').src = dataUrl
            document.getElementById('qr-overlay').style.display = 'flex'
        })
    </script>
</body>
