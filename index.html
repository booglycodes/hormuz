<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trystero WASD Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #080b12;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #ui {
      width: min(900px, 94vw);
      padding: 18px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #status {
      color: #9ca3af;
      font-size: 14px;
      margin-right: auto;
    }

    input,
    button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid #303746;
    }

    input {
      width: 150px;
      padding: 9px 11px;
      background: #151a24;
      color: white;
      outline: none;
    }

    button {
      padding: 9px 14px;
      color: white;
      background: #2563eb;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #game {
      position: relative;
      width: min(900px, 94vw);
      aspect-ratio: 16 / 9;

      background-color: #0f172a;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      border: 2px solid #293244;
      border-radius: 12px;

      overflow: hidden;
    }

    .player {
      position: absolute;

      width: 32px;
      height: 32px;

      transform: translate(-50%, -50%);

      border-radius: 6px;

      pointer-events: none;
      will-change: left, top;
    }

    .player-label {
      position: absolute;
      left: 50%;
      bottom: 100%;

      transform: translateX(-50%);

      margin-bottom: 5px;

      font-size: 10px;
      color: #d1d5db;

      white-space: nowrap;
      user-select: none;
    }

    #help {
      margin-top: 10px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="status">Choose Host or Join</div>

    <input
      id="roomInput"
      value="wasd-demo"
      placeholder="Room name"
    />

    <button id="hostButton">
      Host Game
    </button>

    <button id="joinButton">
      Join Game
    </button>
  </div>

  <div id="game"></div>

  <div id="help">
    WASD to move
  </div>


  <script type="module">

    import {
      joinRoom
    } from "https://cdn.jsdelivr.net/npm/trystero@0.22.0/+esm";


    const APP_ID = "wasd-square-game";

    const WORLD = {
      width: 900,
      height: 506
    };

    const PLAYER_SIZE = 32;
    const SPEED = 280;

    const INPUT_RATE = 33;
    const STATE_RATE = 33;


    // Dynamic color validation for deployment checking
    const myHue = Math.floor(Math.random() * 360);
    const myColor = `hsl(${myHue}, 90%, 60%)`;

    const players = {};
    const remoteInputs = {};
    const playerElements = new Map();
    const serverStates = {};

    let myId = null;
    let room = null;
    let isHost = false;
    let sendInput = null;
    let receiveInput = null;
    let sendState = null;
    let receiveState = null;

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };

    let lastSentKeys = { w: false, a: false, s: false, d: false };


    window.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      if (key in keys) {
        keys[key] = true;
        event.preventDefault();
      }
    });


    window.addEventListener("keyup", event => {
      const key = event.key.toLowerCase();
      if (key in keys) {
        keys[key] = false;
        event.preventDefault();
      }
    });


    function createPlayer() {
      return {
        x: WORLD.width / 2 + (Math.random() - 0.5) * 150,
        y: WORLD.height / 2 + (Math.random() - 0.5) * 150
      };
    }


    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      return `hsl(${h}, 85%, 55%)`;
    }


    function createPlayerElement(id, gameEl) {
      const element = document.createElement("div");
      element.className = "player";

      const color = (id === myId) ? myColor : stringToColor(id);
      element.style.background = color;
      element.style.boxShadow = `0 0 12px ${color}`;

      const label = document.createElement("div");
      label.className = "player-label";
      label.textContent = id === myId ? `YOU [${myHue}°]` : id.slice(0, 6);

      element.appendChild(label);
      gameEl.appendChild(element);
      playerElements.set(id, element);

      return element;
    }


    function renderPlayer(id, gameEl) {
      const player = players[id];
      if (!player) return;

      let element = playerElements.get(id);
      if (!element) {
        element = createPlayerElement(id, gameEl);
      }

      const xPercent = (player.x / WORLD.width) * 100;
      const yPercent = (player.y / WORLD.height) * 100;

      element.style.left = `${xPercent}%`;
      element.style.top = `${yPercent}%`;
    }


    function movePlayer(player, input, dt) {
      let dx = 0;
      let dy = 0;

      if (input.w) dy -= 1;
      if (input.s) dy += 1;
      if (input.a) dx -= 1;
      if (input.d) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const length = Math.hypot(dx, dy);
        dx /= length;
        dy /= length;
      }

      player.x += dx * SPEED * dt;
      player.y += dy * SPEED * dt;

      const half = PLAYER_SIZE / 2;

      player.x = Math.max(half, Math.min(WORLD.width - half, player.x));
      player.y = Math.max(half, Math.min(WORLD.height - half, player.y));
    }


    // Ensure DOM is fully loaded before querying elements
    document.addEventListener("DOMContentLoaded", () => {
      const game = document.querySelector("#game");
      const status = document.querySelector("#status");
      const roomInput = document.querySelector("#roomInput");
      const hostButton = document.querySelector("#hostButton");
      const joinButton = document.querySelector("#joinButton");

      // Update status to show deployment hue verification on load
      status.textContent = `Deployment Hue: ${myHue}° | Choose Host or Join`;

      function startHost() {
        isHost = true;
        const roomName = roomInput.value.trim() || "wasd-demo";

        room = joinRoom({ appId: APP_ID }, roomName);
        myId = room.selfId;

        [sendInput, receiveInput] = room.makeAction("input");

        receiveInput((input, peerId) => {
          remoteInputs[peerId] = {
            w: !!input.w,
            a: !!input.a,
            s: !!input.s,
            d: !!input.d
          };

          if (!players[peerId]) {
            players[peerId] = createPlayer();
          }
        });

        [sendState, receiveState] = room.makeAction("state");
        receiveState(() => {});

        room.onPeerJoin(peerId => {
          players[peerId] = createPlayer();
          remoteInputs[peerId] = { w: false, a: false, s: false, d: false };
          sendState(structuredClone(players));
        });

        room.onPeerLeave(peerId => {
          delete players[peerId];
          delete remoteInputs[peerId];
          broadcastState();
        });

        players[myId] = createPlayer();

        status.textContent = `HOST [${myHue}°] — ${roomName}`;
        hostButton.disabled = true;
        joinButton.disabled = true;
        roomInput.disabled = true;
      }


      function startClient() {
        isHost = false;
        const roomName = roomInput.value.trim() || "wasd-demo";

        room = joinRoom({ appId: APP_ID }, roomName);
        myId = room.selfId;

        [sendInput, receiveInput] = room.makeAction("input");
        receiveInput(() => {});

        [sendState, receiveState] = room.makeAction("state");

        receiveState(state => {
          for (const id of Object.keys(state)) {
            if (id === myId) continue;

            if (!players[id]) {
              players[id] = { ...state[id] };
            }

            serverStates[id] = { x: state[id].x, y: state[id].y };
          }

          for (const id of Object.keys(players)) {
            if (id !== myId && !state[id]) {
              delete players[id];
              delete serverStates[id];
            }
          }
        });

        room.onPeerJoin(peerId => {});
        room.onPeerLeave(peerId => {
          delete players[peerId];
          delete serverStates[peerId];
        });

        players[myId] = createPlayer();

        status.textContent = `CLIENT [${myHue}°] — ${roomName}`;
        hostButton.disabled = true;
        joinButton.disabled = true;
        roomInput.disabled = true;
      }


      let hostLastTime = performance.now();
      let lastBroadcast = performance.now();

      function hostLoop(now) {
        const dt = Math.min((now - hostLastTime) / 1000, 0.05);
        hostLastTime = now;

        if (players[myId]) {
          movePlayer(players[myId], keys, dt);
          renderPlayer(myId, game);
        }

        for (const id of Object.keys(remoteInputs)) {
          if (!players[id]) continue;
          movePlayer(players[id], remoteInputs[id], dt);
          renderPlayer(id, game);
        }

        if (now - lastBroadcast >= STATE_RATE) {
          broadcastState();
          lastBroadcast = now;
        }

        requestAnimationFrame(hostLoop);
      }


      let clientLastTime = performance.now();

      function clientLoop(now) {
        const dt = Math.min((now - clientLastTime) / 1000, 0.05);
        clientLastTime = now;

        if (players[myId]) {
          movePlayer(players[myId], keys, dt);
          renderPlayer(myId, game);
        }

        for (const id of Object.keys(players)) {
          if (id === myId) continue;

          if (serverStates[id]) {
            const lerpFactor = Math.min(1, dt * 15);
            players[id].x += (serverStates[id].x - players[id].x) * lerpFactor;
            players[id].y += (serverStates[id].y - players[id].y) * lerpFactor;
          }

          renderPlayer(id, game);
        }

        for (const [id, element] of playerElements) {
          if (!players[id]) {
            element.remove();
            playerElements.delete(id);
          }
        }

        requestAnimationFrame(clientLoop);
      }


      let lastInputSent = performance.now();

      function networkLoop(now) {
        if (!isHost && sendInput) {
          const keysChanged =
            keys.w !== lastSentKeys.w ||
            keys.a !== lastSentKeys.a ||
            keys.s !== lastSentKeys.s ||
            keys.d !== lastSentKeys.d;

          if (keysChanged || (now - lastInputSent >= INPUT_RATE)) {
            sendInput({
              w: keys.w,
              a: keys.a,
              s: keys.s,
              d: keys.d
            });
            lastSentKeys = { ...keys };
            lastInputSent = now;
          }
        }

        requestAnimationFrame(networkLoop);
      }


      function broadcastState() {
        if (!isHost || !sendState) return;
        sendState(structuredClone(players));
      }


      hostButton.addEventListener("click", () => {
        if (room) return;
        startHost();
        requestAnimationFrame(hostLoop);
        requestAnimationFrame(networkLoop);
      });


      joinButton.addEventListener("click", () => {
        if (room) return;
        startClient();
        requestAnimationFrame(clientLoop);
        requestAnimationFrame(networkLoop);
      });
    });

  </script>

</body>
</html>
