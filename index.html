<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trystero WASD Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #080b12;
      color: white;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #ui {
      width: min(900px, 94vw);
      padding: 18px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #status {
      color: #9ca3af;
      font-size: 14px;
      margin-right: auto;
    }

    input,
    button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid #303746;
    }

    input {
      width: 150px;
      padding: 9px 11px;
      background: #151a24;
      color: white;
      outline: none;
    }

    button {
      padding: 9px 14px;
      color: white;
      background: #2563eb;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #game {
      position: relative;
      width: min(900px, 94vw);
      aspect-ratio: 16 / 9;

      background-color: #0f172a;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 40px 40px;

      border: 2px solid #293244;
      border-radius: 12px;

      overflow: hidden;
    }

    .player {
      position: absolute;

      width: 32px;
      height: 32px;

      transform: translate(-50%, -50%);

      border-radius: 6px;

      /* IMPORTANT:
         There is intentionally NO transition here.
         Movement is updated every animation frame.
      */

      pointer-events: none;
      will-change: left, top;
    }

    .player.me {
      background: #22c55e;
      box-shadow:
        0 0 12px rgba(34, 197, 94, 0.6);
    }

    .player.other {
      background: #ef4444;
      box-shadow:
        0 0 12px rgba(239, 68, 68, 0.5);
    }

    .player-label {
      position: absolute;
      left: 50%;
      bottom: 100%;

      transform: translateX(-50%);

      margin-bottom: 5px;

      font-size: 10px;
      color: #d1d5db;

      white-space: nowrap;
      user-select: none;
    }

    #help {
      margin-top: 10px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="status">Choose Host or Join</div>

    <input
      id="roomInput"
      value="wasd-demo"
      placeholder="Room name"
    />

    <button id="hostButton">
      Host Game
    </button>

    <button id="joinButton">
      Join Game
    </button>
  </div>

  <div id="game"></div>

  <div id="help">
    WASD to move
  </div>


  <script type="module">

    /*
     * ============================================================
     * TRYSTERO
     * ============================================================
     */

    import {
      joinRoom
    } from "https://cdn.jsdelivr.net/npm/trystero@0.22.0/+esm";


    /*
     * ============================================================
     * CONFIG
     * ============================================================
     */

    const APP_ID = "wasd-square-game";

    const WORLD = {
      width: 900,
      height: 506
    };

    const PLAYER_SIZE = 32;

    const SPEED = 280;

    // Network input rate.
    // This does NOT control local movement.
    const INPUT_RATE = 16;

    // Host state broadcast rate.
    const STATE_RATE = 16;


    /*
     * ============================================================
     * DOM
     * ============================================================
     */

    const game = document.querySelector("#game");

    const status = document.querySelector("#status");

    const roomInput =
      document.querySelector("#roomInput");

    const hostButton =
      document.querySelector("#hostButton");

    const joinButton =
      document.querySelector("#joinButton");


    /*
     * ============================================================
     * PLAYER ID
     * ============================================================
     */

    const myId =
      crypto.randomUUID();


    /*
     * ============================================================
     * GAME STATE
     * ============================================================
     */

    // Player positions.

    const players = {};

    // Inputs known by the host.

    const remoteInputs = {};

    // DOM elements for players.

    const playerElements = new Map();


    /*
     * ============================================================
     * LOCAL INPUT
     * ============================================================
     */

    const keys = {
      w: false,
      a: false,
      s: false,
      d: false
    };


    window.addEventListener("keydown", event => {

      const key = event.key.toLowerCase();

      if (key in keys) {

        keys[key] = true;

        event.preventDefault();
      }
    });


    window.addEventListener("keyup", event => {

      const key = event.key.toLowerCase();

      if (key in keys) {

        keys[key] = false;

        event.preventDefault();
      }
    });


    /*
     * ============================================================
     * ROOM
     * ============================================================
     */

    let room = null;

    let isHost = false;

    let sendInput = null;

    let receiveInput = null;

    let sendState = null;

    let receiveState = null;


    /*
     * ============================================================
     * RANDOM PLAYER SPAWN
     * ============================================================
     */

    function createPlayer() {

      return {

        x:
          WORLD.width / 2 +
          (Math.random() - 0.5) * 150,

        y:
          WORLD.height / 2 +
          (Math.random() - 0.5) * 150
      };
    }


    /*
     * ============================================================
     * DOM PLAYER
     * ============================================================
     */

    function createPlayerElement(id) {

      const element =
        document.createElement("div");

      element.className =
        id === myId
          ? "player me"
          : "player other";


      const label =
        document.createElement("div");

      label.className =
        "player-label";

      label.textContent =
        id === myId
          ? "YOU"
          : id.slice(0, 6);


      element.appendChild(label);

      game.appendChild(element);

      playerElements.set(
        id,
        element
      );

      return element;
    }


    /*
     * ============================================================
     * RENDER ONE PLAYER
     *
     * IMPORTANT:
     * This is called every animation frame for our own player.
     *
     * There is no network wait here.
     * ============================================================
     */

    function renderPlayer(id) {

      const player =
        players[id];

      if (!player) {
        return;
      }


      let element =
        playerElements.get(id);


      if (!element) {

        element =
          createPlayerElement(id);
      }


      const xPercent =
        (player.x / WORLD.width) * 100;

      const yPercent =
        (player.y / WORLD.height) * 100;


      element.style.left =
        `${xPercent}%`;

      element.style.top =
        `${yPercent}%`;
    }


    /*
     * ============================================================
     * RENDER EVERYTHING
     * ============================================================
     */

    function renderAll() {

      for (const id of Object.keys(players)) {

        renderPlayer(id);
      }


      // Remove players that left.

      for (const [id, element] of playerElements) {

        if (!players[id]) {

          element.remove();

          playerElements.delete(id);
        }
      }
    }


    /*
     * ============================================================
     * MOVEMENT
     * ============================================================
     */

    function movePlayer(
      player,
      input,
      dt
    ) {

      let dx = 0;
      let dy = 0;


      if (input.w) {
        dy -= 1;
      }

      if (input.s) {
        dy += 1;
      }

      if (input.a) {
        dx -= 1;
      }

      if (input.d) {
        dx += 1;
      }


      // Normalize diagonal movement.

      if (dx !== 0 || dy !== 0) {

        const length =
          Math.hypot(dx, dy);

        dx /= length;
        dy /= length;
      }


      player.x +=
        dx * SPEED * dt;

      player.y +=
        dy * SPEED * dt;


      // Keep player inside world.

      const half =
        PLAYER_SIZE / 2;


      player.x =
        Math.max(
          half,
          Math.min(
            WORLD.width - half,
            player.x
          )
        );


      player.y =
        Math.max(
          half,
          Math.min(
            WORLD.height - half,
            player.y
          )
        );
    }


    /*
     * ============================================================
     * HOST
     * ============================================================
     */

    function startHost() {

      isHost = true;

      const roomName =
        roomInput.value.trim() ||
        "wasd-demo";


      room =
        joinRoom(
          {
            appId: APP_ID
          },
          roomName
        );


      /*
       * ----------------------------------------------------------
       * INPUT ACTION
       * ----------------------------------------------------------
       */

      [
        sendInput,
        receiveInput
      ] =
        room.makeAction("input");


      /*
       * Host receives input from clients.
       */

      receiveInput(
        (input, peerId) => {

          remoteInputs[peerId] = {
            w: !!input.w,
            a: !!input.a,
            s: !!input.s,
            d: !!input.d
          };


          // Make sure the player exists.

          if (!players[peerId]) {

            players[peerId] =
              createPlayer();
          }
        }
      );


      /*
       * ----------------------------------------------------------
       * STATE ACTION
       * ----------------------------------------------------------
       */

      [
        sendState,
        receiveState
      ] =
        room.makeAction("state");


      /*
       * Host doesn't need to receive state.
       */

      receiveState(
        () => {}
      );


      /*
       * ----------------------------------------------------------
       * PLAYER JOIN
       * ----------------------------------------------------------
       */

      room.onPeerJoin(
        peerId => {

          console.log(
            "Player joined:",
            peerId
          );


          players[peerId] =
            createPlayer();


          remoteInputs[peerId] = {
            w: false,
            a: false,
            s: false,
            d: false
          };


          /*
           * Immediately send the new player
           * the current state.
           */

          sendState(
            structuredClone(players)
          );
        }
      );


      /*
       * ----------------------------------------------------------
       * PLAYER LEAVE
       * ----------------------------------------------------------
       */

      room.onPeerLeave(
        peerId => {

          console.log(
            "Player left:",
            peerId
          );


          delete players[peerId];

          delete remoteInputs[peerId];


          renderAll();


          broadcastState();
        }
      );


      /*
       * Create host player.
       */

      players[myId] =
        createPlayer();


      status.textContent =
        `HOST — ${roomName}`;


      hostButton.disabled = true;
      joinButton.disabled = true;
      roomInput.disabled = true;


      console.log(
        "Hosting room:",
        roomName
      );
    }


    /*
     * ============================================================
     * CLIENT
     * ============================================================
     */

    function startClient() {

      isHost = false;

      const roomName =
        roomInput.value.trim() ||
        "wasd-demo";


      room =
        joinRoom(
          {
            appId: APP_ID
          },
          roomName
        );


      /*
       * ----------------------------------------------------------
       * INPUT
       * ----------------------------------------------------------
       */

      [
        sendInput,
        receiveInput
      ] =
        room.makeAction("input");


      /*
       * Only host should receive inputs.
       */

      receiveInput(
        () => {}
      );


      /*
       * ----------------------------------------------------------
       * STATE
       * ----------------------------------------------------------
       */

      [
        sendState,
        receiveState
      ] =
        room.makeAction("state");


      /*
       * Receive authoritative state from host.
       *
       * We intentionally DO NOT overwrite our own
       * local position here.
       *
       * That would make WASD movement snap every
       * time a network packet arrived.
       */

      receiveState(
        state => {

          for (const id of Object.keys(state)) {

            // Don't overwrite local prediction.

            if (id === myId) {
              continue;
            }


            players[id] = state[id];
          }


          // Remove players that no longer exist.

          for (const id of Object.keys(players)) {

            if (
              id !== myId &&
              !state[id]
            ) {
              delete players[id];
            }
          }


          renderAll();
        }
      );


      /*
       * ----------------------------------------------------------
       * JOIN
       * ----------------------------------------------------------
       */

      room.onPeerJoin(
        peerId => {

          console.log(
            "Connected to peer:",
            peerId
          );
        }
      );


      /*
       * ----------------------------------------------------------
       * LEAVE
       * ----------------------------------------------------------
       */

      room.onPeerLeave(
        peerId => {

          delete players[peerId];

          renderAll();
        }
      );


      /*
       * Create our local player immediately.
       *
       * This means WASD works before the first
       * state packet comes back.
       */

      players[myId] =
        createPlayer();


      status.textContent =
        `CLIENT — ${roomName}`;


      hostButton.disabled = true;
      joinButton.disabled = true;
      roomInput.disabled = true;


      console.log(
        "Joined room:",
        roomName
      );
    }


    /*
     * ============================================================
     * HOST GAME LOOP
     *
     * Runs independently from networking.
     *
     * 60 FPS / display refresh rate.
     * ============================================================
     */

    let hostLastTime =
      performance.now();


    let lastBroadcast =
      performance.now();


    function hostLoop(now) {

      const dt =
        Math.min(
          (now - hostLastTime) / 1000,
          0.05
        );


      hostLastTime =
        now;


      /*
       * Host's own movement.
       */

      if (players[myId]) {

        movePlayer(
          players[myId],
          keys,
          dt
        );


        renderPlayer(myId);
      }


      /*
       * Remote player movement.
       *
       * The HOST is authoritative.
       */

      for (
        const id of Object.keys(remoteInputs)
      ) {

        if (!players[id]) {
          continue;
        }


        movePlayer(
          players[id],
          remoteInputs[id],
          dt
        );


        renderPlayer(id);
      }


      /*
       * Network state is separate from rendering.
       *
       * Even if networking is slow, the host's
       * local movement remains smooth.
       */

      if (
        now - lastBroadcast >= STATE_RATE
      ) {

        broadcastState();

        lastBroadcast =
          now;
      }


      requestAnimationFrame(
        hostLoop
      );
    }


    /*
     * ============================================================
     * CLIENT LOCAL LOOP
     *
     * THIS is what makes WASD feel instant.
     *
     * The client moves its own player locally every
     * browser frame.
     * ============================================================
     */

    let clientLastTime =
      performance.now();


    function clientLoop(now) {

      const dt =
        Math.min(
          (now - clientLastTime) / 1000,
          0.05
        );


      clientLastTime =
        now;


      /*
       * Local prediction.
       */

      if (players[myId]) {

        movePlayer(
          players[myId],
          keys,
          dt
        );


        renderPlayer(myId);
      }


      /*
       * Other players are rendered from the
       * latest host state.
       */

      for (const id of Object.keys(players)) {

        if (id !== myId) {

          renderPlayer(id);
        }
      }


      requestAnimationFrame(
        clientLoop
      );
    }


    /*
     * ============================================================
     * CLIENT NETWORK LOOP
     *
     * This does NOT move the player.
     *
     * It only tells the host what buttons we're pressing.
     * ============================================================
     */

    let lastInputSent =
      performance.now();


    function networkLoop(now) {

      if (
        !isHost &&
        sendInput &&
        now - lastInputSent >= INPUT_RATE
      ) {

        sendInput({
          w: keys.w,
          a: keys.a,
          s: keys.s,
          d: keys.d
        });


        lastInputSent =
          now;
      }


      requestAnimationFrame(
        networkLoop
      );
    }


    /*
     * ============================================================
     * BROADCAST STATE
     * ============================================================
     */

    function broadcastState() {

      if (
        !isHost ||
        !sendState
      ) {
        return;
      }


      sendState(
        structuredClone(players)
      );
    }


    /*
     * ============================================================
     * BUTTONS
     * ============================================================
     */

    hostButton.addEventListener(
      "click",
      () => {

        if (room) {
          return;
        }


        startHost();


        /*
         * Start immediately.
         */

        requestAnimationFrame(
          hostLoop
        );

        requestAnimationFrame(
          networkLoop
        );
      }
    );


    joinButton.addEventListener(
      "click",
      () => {

        if (room) {
          return;
        }


        startClient();


        /*
         * Start local prediction immediately.
         */

        requestAnimationFrame(
          clientLoop
        );

        requestAnimationFrame(
          networkLoop
        );
      }
    );


    /*
     * ============================================================
     * INITIAL
     * ============================================================
     */

    console.log(
      "Your player ID:",
      myId
    );

  </script>

</body>
</html>
