<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.getElementById("c")
    const ctx = canvas.getContext("2d")

    function resize() {
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }
    window.addEventListener("resize", resize)
    resize()

    // === Layout ===
    function getLayout() {
      const w = canvas.width
      const h = canvas.height
      const joystickR = Math.min(w, h) * 0.18
      const joystickCenter = { x: w * 0.22, y: h * 0.55 }
      const btnR = Math.min(w, h) * 0.09
      const jumpR = Math.min(w, h) * 0.11

      // 4 attack buttons in diamond on right side
      const btnCenter = { x: w * 0.78, y: h * 0.55 }
      const btnSpread = btnR * 1.6
      const buttons = [
        { x: btnCenter.x, y: btnCenter.y - btnSpread, label: "1" },       // top
        { x: btnCenter.x - btnSpread, y: btnCenter.y, label: "2" },       // left
        { x: btnCenter.x + btnSpread, y: btnCenter.y, label: "3" },       // right
        { x: btnCenter.x, y: btnCenter.y + btnSpread, label: "4" },       // bottom
      ]

      // Jump button bottom center
      const jump = { x: w * 0.5, y: h * 0.82, r: jumpR }

      return { joystickCenter, joystickR, buttons, btnR, jump }
    }

    // === Input state ===
    let input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false }
    let joystickKnob = { x: 0, y: 0 } // offset from center
    let joystickTouch = null
    let jumpTouch = null
    let btnTouches = {} // touchId -> btnIndex

    // === Touch handling ===
    function hitTest(tx, ty, layout) {
      const { joystickCenter, joystickR, buttons, btnR, jump } = layout

      // Joystick
      if (Math.hypot(tx - joystickCenter.x, ty - joystickCenter.y) < joystickR * 1.5) {
        return { type: "joystick" }
      }

      // Jump
      if (Math.hypot(tx - jump.x, ty - jump.y) < jump.r * 1.3) {
        return { type: "jump" }
      }

      // Buttons
      for (let i = 0; i < buttons.length; i++) {
        if (Math.hypot(tx - buttons[i].x, ty - buttons[i].y) < btnR * 1.3) {
          return { type: "button", index: i }
        }
      }

      return null
    }

    canvas.addEventListener("touchstart", e => {
      e.preventDefault()
      const layout = getLayout()
      for (const touch of e.changedTouches) {
        const hit = hitTest(touch.clientX, touch.clientY, layout)
        if (!hit) continue
        if (hit.type === "joystick" && joystickTouch === null) {
          joystickTouch = touch.identifier
          updateJoystick(touch.clientX, touch.clientY, layout)
        } else if (hit.type === "jump") {
          jumpTouch = touch.identifier
          input.jump = true
        } else if (hit.type === "button") {
          btnTouches[touch.identifier] = hit.index
          input[`b${hit.index}`] = true
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchmove", e => {
      e.preventDefault()
      const layout = getLayout()
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          updateJoystick(touch.clientX, touch.clientY, layout)
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchend", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === jumpTouch) {
          jumpTouch = null
          input.jump = false
        } else if (touch.identifier in btnTouches) {
          const idx = btnTouches[touch.identifier]
          input[`b${idx}`] = false
          delete btnTouches[touch.identifier]
        }
      }
    })

    canvas.addEventListener("touchcancel", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === jumpTouch) {
          jumpTouch = null
          input.jump = false
        } else if (touch.identifier in btnTouches) {
          const idx = btnTouches[touch.identifier]
          input[`b${idx}`] = false
          delete btnTouches[touch.identifier]
        }
      }
    })

    function updateJoystick(cx, cy, layout) {
      const { joystickCenter, joystickR } = layout
      let dx = cx - joystickCenter.x
      let dy = cy - joystickCenter.y
      const dist = Math.hypot(dx, dy)
      const maxDist = joystickR * 0.7
      if (dist > maxDist) {
        dx = (dx / dist) * maxDist
        dy = (dy / dist) * maxDist
      }
      joystickKnob = { x: dx, y: dy }
      input.dx = dx / maxDist
      input.dy = dy / maxDist
    }

    // === Rendering ===
    let status = "Connecting..."

    function draw() {
      const layout = getLayout()
      const { joystickCenter, joystickR, buttons, btnR, jump } = layout

      ctx.fillStyle = "#080b12"
      ctx.fillRect(0, 0, canvas.width, canvas.height)

      // Status
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${Math.round(canvas.height * 0.035)}px system-ui`
      ctx.textAlign = "center"
      ctx.fillText(status, canvas.width / 2, canvas.height * 0.08)

      // Joystick base
      ctx.beginPath()
      ctx.arc(joystickCenter.x, joystickCenter.y, joystickR, 0, Math.PI * 2)
      ctx.fillStyle = "#1e293b"
      ctx.fill()
      ctx.strokeStyle = "#334155"
      ctx.lineWidth = 2
      ctx.stroke()

      // Joystick knob
      const knobR = joystickR * 0.38
      ctx.beginPath()
      ctx.arc(joystickCenter.x + joystickKnob.x, joystickCenter.y + joystickKnob.y, knobR, 0, Math.PI * 2)
      const knobActive = joystickTouch !== null
      ctx.fillStyle = knobActive ? "#3b82f6" : "#1d4ed8"
      ctx.fill()
      if (knobActive) {
        ctx.shadowColor = "#3b82f6"
        ctx.shadowBlur = 20
        ctx.fill()
        ctx.shadowBlur = 0
      }

      // Attack buttons
      for (let i = 0; i < buttons.length; i++) {
        const b = buttons[i]
        const active = input[`b${i}`]
        ctx.beginPath()
        ctx.arc(b.x, b.y, btnR, 0, Math.PI * 2)
        ctx.fillStyle = active ? "#2563eb" : "#1e293b"
        ctx.fill()
        ctx.strokeStyle = active ? "#3b82f6" : "#334155"
        ctx.lineWidth = 2
        ctx.stroke()
        if (active) {
          ctx.shadowColor = "#3b82f6"
          ctx.shadowBlur = 16
          ctx.fill()
          ctx.shadowBlur = 0
        }
        ctx.fillStyle = active ? "white" : "#94a3b8"
        ctx.font = `bold ${Math.round(btnR * 0.6)}px system-ui`
        ctx.textAlign = "center"
        ctx.textBaseline = "middle"
        ctx.fillText(b.label, b.x, b.y)
      }

      // Jump button
      const jumpActive = input.jump
      ctx.beginPath()
      ctx.arc(jump.x, jump.y, jump.r, 0, Math.PI * 2)
      ctx.fillStyle = jumpActive ? "#16a34a" : "#1e293b"
      ctx.fill()
      ctx.strokeStyle = jumpActive ? "#22c55e" : "#334155"
      ctx.lineWidth = 2
      ctx.stroke()
      if (jumpActive) {
        ctx.shadowColor = "#22c55e"
        ctx.shadowBlur = 16
        ctx.fill()
        ctx.shadowBlur = 0
      }
      ctx.fillStyle = jumpActive ? "white" : "#94a3b8"
      ctx.font = `bold ${Math.round(jump.r * 0.4)}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText("JUMP", jump.x, jump.y)

      requestAnimationFrame(draw)
    }
    requestAnimationFrame(draw)

    // === Networking ===
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")

    if (!roomName) {
      status = "No room. Scan QR to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.22.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [sendInput, _receiveInput] = room.makeAction("input")
      _receiveInput(() => {})

      room.onPeerJoin(() => { status = "Connected ✓" })
      room.onPeerLeave(() => { status = "Host disconnected" })

      // Send input at 30Hz
      setInterval(() => {
        sendInput({ ...input })
      }, 33)
    }
  </script>
</body>
</html>
