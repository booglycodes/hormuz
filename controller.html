<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      font-family: system-ui, sans-serif;
      color: white;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #9ca3af;
    }

    /* Joystick (left side) */
    #joystick-area {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      flex-shrink: 0;
    }

    #joystick-knob {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.5);
    }

    #joystick-knob.active {
      box-shadow: 0 0 24px rgba(59, 130, 246, 0.8);
    }

    /* Buttons (right side) */
    #buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      width: 160px;
      height: 160px;
      flex-shrink: 0;
    }

    .btn {
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      transition: background 0.05s, box-shadow 0.05s;
    }

    .btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: white;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.5);
    }

    /* Jump button (bottom center) */
    #jump-area {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 50px;
      border-radius: 25px;
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #94a3b8;
      font-weight: bold;
    }

    #jump-area.active {
      background: #16a34a;
      border-color: #22c55e;
      color: white;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.5);
    }
  </style>
</head>
<body>

  <div id="status">Connecting...</div>

  <div id="joystick-area">
    <div id="joystick-knob"></div>
  </div>

  <div id="jump-area">JUMP</div>

  <div id="buttons">
    <div class="btn" data-btn="0">1</div>
    <div class="btn" data-btn="1">2</div>
    <div class="btn" data-btn="2">3</div>
    <div class="btn" data-btn="3">4</div>
  </div>

  <script type="module">
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")
    const status = document.getElementById("status")

    if (!roomName) {
      status.textContent = "No room specified. Scan QR code to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.22.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [sendInput, _receiveInput] = room.makeAction("input")
      _receiveInput(() => {})

      room.onPeerJoin(() => { status.textContent = "Connected ✓" })
      room.onPeerLeave(() => { status.textContent = "Host disconnected" })

      // === Input state ===
      let input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false }

      // === Joystick ===
      const joystickArea = document.getElementById("joystick-area")
      const knob = document.getElementById("joystick-knob")
      const maxDist = 55
      let joystickTouch = null

      function updateJoystick(cx, cy) {
        const rect = joystickArea.getBoundingClientRect()
        let dx = cx - (rect.left + rect.width / 2)
        let dy = cy - (rect.top + rect.height / 2)
        const dist = Math.hypot(dx, dy)
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`
        knob.classList.add("active")
        input.dx = dx / maxDist
        input.dy = dy / maxDist
      }

      function resetJoystick() {
        knob.style.transform = "translate(-50%, -50%)"
        knob.classList.remove("active")
        input.dx = 0
        input.dy = 0
        joystickTouch = null
      }

      joystickArea.addEventListener("touchstart", e => {
        e.preventDefault()
        joystickTouch = e.changedTouches[0].identifier
        updateJoystick(e.changedTouches[0].clientX, e.changedTouches[0].clientY)
      }, { passive: false })

      joystickArea.addEventListener("touchmove", e => {
        e.preventDefault()
        for (const t of e.changedTouches) {
          if (t.identifier === joystickTouch) { updateJoystick(t.clientX, t.clientY); break }
        }
      }, { passive: false })

      joystickArea.addEventListener("touchend", e => {
        for (const t of e.changedTouches) {
          if (t.identifier === joystickTouch) { resetJoystick(); break }
        }
      })
      joystickArea.addEventListener("touchcancel", resetJoystick)

      // === Jump button ===
      const jumpArea = document.getElementById("jump-area")
      jumpArea.addEventListener("touchstart", e => { e.preventDefault(); input.jump = true; jumpArea.classList.add("active") }, { passive: false })
      jumpArea.addEventListener("touchend", e => { input.jump = false; jumpArea.classList.remove("active") })
      jumpArea.addEventListener("touchcancel", () => { input.jump = false; jumpArea.classList.remove("active") })

      // === Attack buttons ===
      const btns = document.querySelectorAll(".btn")
      btns.forEach(btn => {
        const idx = btn.dataset.btn
        btn.addEventListener("touchstart", e => { e.preventDefault(); input[`b${idx}`] = true; btn.classList.add("active") }, { passive: false })
        btn.addEventListener("touchend", () => { input[`b${idx}`] = false; btn.classList.remove("active") })
        btn.addEventListener("touchcancel", () => { input[`b${idx}`] = false; btn.classList.remove("active") })
      })

      // === Send input at 30Hz ===
      setInterval(() => {
        sendInput({ ...input })
      }, 33)
    }
  </script>
</body>
</html>
