<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.getElementById("c")
    const ctx = canvas.getContext("2d")

    function resize() {
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }
    window.addEventListener("resize", resize)
    resize()

    // === Input state ===
    let input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false, b4: false }
    let joystickKnob = { x: 0, y: 0 }
    let joystickTouch = null

    // Gesture state
    const SWIPE_THRESHOLD = 30
    const TAP_TIME = 200
    const HOLD_TIME = 300
    let gestureTouch = null
    let gestureStart = null
    let gestureTriggered = false
    let holdActive = false

    // Floating gesture indicators
    const floaters = [] // { text, x, y, born, color }
    const FLOAT_DURATION = 800 // ms
    const FLOAT_RISE = 60 // px total rise

    // Labels from host (per character)
    let gestureLabels = { up: "ATK 1", left: "ATK 2", right: "ATK 3", down: "ATK 4", hold: "ATK 5" }

    function spawnFloater(type) {
      const gCx = canvas.width * 0.75
      const gCy = canvas.height * 0.5
      const jitter = (Math.random() - 0.5) * 40

      let text, color
      switch (type) {
        case "tap": text = "JUMP"; color = "#22c55e"; break
        case "hold": text = gestureLabels.hold || "ATK 5"; color = "#a855f7"; break
        case "up": text = gestureLabels.up || "↑"; color = "#3b82f6"; break
        case "down": text = gestureLabels.down || "↓"; color = "#3b82f6"; break
        case "left": text = gestureLabels.left || "←"; color = "#3b82f6"; break
        case "right": text = gestureLabels.right || "→"; color = "#3b82f6"; break
        default: text = type; color = "#3b82f6"
      }

      floaters.push({
        text,
        color,
        x: gCx + jitter,
        y: gCy + (Math.random() - 0.5) * 30,
        born: performance.now()
      })
    }

    // === Touch handling ===
    function isLeftHalf(x) { return x < canvas.width / 2 }

    canvas.addEventListener("touchstart", e => {
      e.preventDefault()
      for (const touch of e.changedTouches) {
        if (isLeftHalf(touch.clientX) && joystickTouch === null) {
          joystickTouch = touch.identifier
          updateJoystick(touch.clientX, touch.clientY)
        } else if (!isLeftHalf(touch.clientX) && gestureTouch === null) {
          gestureTouch = touch.identifier
          gestureStart = { x: touch.clientX, y: touch.clientY, time: performance.now() }
          gestureTriggered = false
          holdActive = false
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchmove", e => {
      e.preventDefault()
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          updateJoystick(touch.clientX, touch.clientY)
        } else if (touch.identifier === gestureTouch && gestureStart && !gestureTriggered) {
          const dx = touch.clientX - gestureStart.x
          const dy = touch.clientY - gestureStart.y
          const dist = Math.hypot(dx, dy)
          if (dist > SWIPE_THRESHOLD) {
            if (Math.abs(dx) > Math.abs(dy)) {
              triggerGesture(dx > 0 ? "right" : "left")
            } else {
              triggerGesture(dy > 0 ? "down" : "up")
            }
            gestureTriggered = true
          }
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchend", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === gestureTouch) {
          if (!gestureTriggered && gestureStart) {
            const elapsed = performance.now() - gestureStart.time
            if (elapsed < TAP_TIME) {
              triggerGesture("tap")
            }
          }
          gestureTouch = null
          gestureStart = null
          if (holdActive) { input.b4 = false; holdActive = false }
        }
      }
    })

    canvas.addEventListener("touchcancel", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === gestureTouch) {
          gestureTouch = null
          gestureStart = null
          if (holdActive) { input.b4 = false; holdActive = false }
        }
      }
    })

    function updateJoystick(cx, cy) {
      const centerX = canvas.width * 0.22
      const centerY = canvas.height * 0.5
      const maxDist = Math.min(canvas.width, canvas.height) * 0.13
      let dx = cx - centerX
      let dy = cy - centerY
      const dist = Math.hypot(dx, dy)
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist }
      joystickKnob = { x: dx, y: dy }
      input.dx = dx / maxDist
      input.dy = dy / maxDist
    }

    function triggerGesture(type) {
      spawnFloater(type)

      if (type === "tap") {
        input.jump = true
        setTimeout(() => { input.jump = false }, 100)
      } else if (type === "up") {
        input.b0 = true
        setTimeout(() => { input.b0 = false }, 100)
      } else if (type === "left") {
        input.b1 = true
        setTimeout(() => { input.b1 = false }, 100)
      } else if (type === "right") {
        input.b2 = true
        setTimeout(() => { input.b2 = false }, 100)
      } else if (type === "down") {
        input.b3 = true
        setTimeout(() => { input.b3 = false }, 100)
      }
    }

    function checkHold() {
      if (gestureTouch !== null && gestureStart && !gestureTriggered && !holdActive) {
        const elapsed = performance.now() - gestureStart.time
        if (elapsed > HOLD_TIME) {
          holdActive = true
          input.b4 = true
          spawnFloater("hold")
        }
      }
    }

    // === Rendering ===
    let status = "Connecting..."

    function draw() {
      checkHold()
      const now = performance.now()
      const w = canvas.width
      const h = canvas.height

      ctx.fillStyle = "#080b12"
      ctx.fillRect(0, 0, w, h)

      // Divider
      ctx.strokeStyle = "#1e293b"
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(w / 2, 0)
      ctx.lineTo(w / 2, h)
      ctx.stroke()

      // Status
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${Math.round(h * 0.03)}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "top"
      ctx.fillText(status, w / 2, h * 0.03)

      // === Left: Joystick ===
      const jCx = w * 0.22
      const jCy = h * 0.5
      const jR = Math.min(w, h) * 0.18

      ctx.beginPath()
      ctx.arc(jCx, jCy, jR, 0, Math.PI * 2)
      ctx.fillStyle = "#1e293b"
      ctx.fill()
      ctx.strokeStyle = "#334155"
      ctx.lineWidth = 2
      ctx.stroke()

      const knobR = jR * 0.38
      const knobActive = joystickTouch !== null
      ctx.beginPath()
      ctx.arc(jCx + joystickKnob.x, jCy + joystickKnob.y, knobR, 0, Math.PI * 2)
      ctx.fillStyle = knobActive ? "#3b82f6" : "#1d4ed8"
      ctx.fill()
      if (knobActive) {
        ctx.shadowColor = "#3b82f6"
        ctx.shadowBlur = 20
        ctx.fill()
        ctx.shadowBlur = 0
      }

      // === Right: Gesture area hint ===
      const gCx = w * 0.75
      const gCy = h * 0.5

      ctx.fillStyle = "#1e293b22"
      ctx.beginPath()
      ctx.arc(gCx, gCy, Math.min(w * 0.2, h * 0.35), 0, Math.PI * 2)
      ctx.fill()

      // Hint text (faint)
      ctx.fillStyle = "#334155"
      ctx.font = `${Math.round(h * 0.025)}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"
      ctx.fillText("swipe / tap", gCx, gCy + Math.min(w * 0.2, h * 0.35) + h * 0.04)

      // === Floating gesture indicators ===
      const fontSize = Math.round(h * 0.08)
      ctx.font = `bold ${fontSize}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"

      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i]
        const age = now - f.born
        if (age > FLOAT_DURATION) {
          floaters.splice(i, 1)
          continue
        }
        const t = age / FLOAT_DURATION // 0..1
        const alpha = 1 - t
        const rise = t * FLOAT_RISE
        ctx.globalAlpha = alpha
        ctx.fillStyle = f.color
        ctx.fillText(f.text, f.x, f.y - rise)
        ctx.globalAlpha = 1
      }

      requestAnimationFrame(draw)
    }
    requestAnimationFrame(draw)

    // === Networking ===
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")

    if (!roomName) {
      status = "No room. Scan QR to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.22.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [sendInput, _receiveInput] = room.makeAction("input")
      _receiveInput(() => {})

      const [_sendCharInfo, receiveCharInfo] = room.makeAction("charinfo")
      receiveCharInfo((labels) => {
        gestureLabels = labels
        status = "Connected ✓"
      })

      room.onPeerJoin(() => { status = "Connected ✓" })
      room.onPeerLeave(() => { status = "Host disconnected" })

      setInterval(() => { sendInput({ ...input }) }, 33)
    }
  </script>
</body>
</html>
