<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Controller</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080b12;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script type="module">
    const canvas = document.getElementById("c")
    const ctx = canvas.getContext("2d")

    function resize() {
      canvas.width = window.innerWidth
      canvas.height = window.innerHeight
    }
    window.addEventListener("resize", resize)
    resize()

    // === Input state ===
    // b0 = swipe up, b1 = swipe left, b2 = swipe right, b3 = swipe down
    let input = { dx: 0, dy: 0, jump: false, b0: false, b1: false, b2: false, b3: false }
    let joystickKnob = { x: 0, y: 0 }
    let joystickTouch = null

    // Gesture state
    const SWIPE_THRESHOLD = 30
    const TAP_TIME = 200 // ms
    const HOLD_TIME = 300 // ms
    let gestureTouch = null
    let gestureStart = null // { x, y, time }
    let gestureTriggered = false
    let lastGesture = null // for display: { type, time }
    let holdActive = false

    // === Touch handling ===
    function isLeftHalf(x) { return x < canvas.width / 2 }

    canvas.addEventListener("touchstart", e => {
      e.preventDefault()
      for (const touch of e.changedTouches) {
        if (isLeftHalf(touch.clientX) && joystickTouch === null) {
          joystickTouch = touch.identifier
          updateJoystick(touch.clientX, touch.clientY)
        } else if (!isLeftHalf(touch.clientX) && gestureTouch === null) {
          gestureTouch = touch.identifier
          gestureStart = { x: touch.clientX, y: touch.clientY, time: performance.now() }
          gestureTriggered = false
          holdActive = false
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchmove", e => {
      e.preventDefault()
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          updateJoystick(touch.clientX, touch.clientY)
        } else if (touch.identifier === gestureTouch && gestureStart && !gestureTriggered) {
          const dx = touch.clientX - gestureStart.x
          const dy = touch.clientY - gestureStart.y
          const dist = Math.hypot(dx, dy)
          if (dist > SWIPE_THRESHOLD) {
            // Determine swipe direction
            if (Math.abs(dx) > Math.abs(dy)) {
              if (dx > 0) triggerGesture("right")
              else triggerGesture("left")
            } else {
              if (dy > 0) triggerGesture("down")
              else triggerGesture("up")
            }
            gestureTriggered = true
          }
        }
      }
    }, { passive: false })

    canvas.addEventListener("touchend", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === gestureTouch) {
          if (!gestureTriggered && gestureStart) {
            const elapsed = performance.now() - gestureStart.time
            if (elapsed < TAP_TIME) {
              triggerGesture("tap")
            }
          }
          gestureTouch = null
          gestureStart = null
          holdActive = false
          input.jump = false
        }
      }
    })

    canvas.addEventListener("touchcancel", e => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === joystickTouch) {
          joystickTouch = null
          joystickKnob = { x: 0, y: 0 }
          input.dx = 0; input.dy = 0
        } else if (touch.identifier === gestureTouch) {
          gestureTouch = null
          gestureStart = null
          holdActive = false
          input.jump = false
        }
      }
    })

    function updateJoystick(cx, cy) {
      const centerX = canvas.width * 0.22
      const centerY = canvas.height * 0.5
      const maxDist = Math.min(canvas.width, canvas.height) * 0.13
      let dx = cx - centerX
      let dy = cy - centerY
      const dist = Math.hypot(dx, dy)
      if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist }
      joystickKnob = { x: dx, y: dy }
      input.dx = dx / maxDist
      input.dy = dy / maxDist
    }

    function triggerGesture(type) {
      lastGesture = { type, time: performance.now() }

      if (type === "tap") {
        // Tap = jump (pulse)
        input.jump = true
        setTimeout(() => { input.jump = false }, 100)
      } else if (type === "up") {
        input.b0 = true
        setTimeout(() => { input.b0 = false }, 100)
      } else if (type === "left") {
        input.b1 = true
        setTimeout(() => { input.b1 = false }, 100)
      } else if (type === "right") {
        input.b2 = true
        setTimeout(() => { input.b2 = false }, 100)
      } else if (type === "down") {
        input.b3 = true
        setTimeout(() => { input.b3 = false }, 100)
      }
    }

    // Check for hold gesture each frame
    function checkHold() {
      if (gestureTouch !== null && gestureStart && !gestureTriggered && !holdActive) {
        const elapsed = performance.now() - gestureStart.time
        if (elapsed > HOLD_TIME) {
          holdActive = true
          input.jump = true
          lastGesture = { type: "hold", time: performance.now() }
        }
      }
    }

    // === Rendering ===
    let status = "Connecting..."

    function draw() {
      resize() // keep responsive
      checkHold()

      const w = canvas.width
      const h = canvas.height

      ctx.fillStyle = "#080b12"
      ctx.fillRect(0, 0, w, h)

      // Divider line
      ctx.strokeStyle = "#1e293b"
      ctx.lineWidth = 2
      ctx.beginPath()
      ctx.moveTo(w / 2, 0)
      ctx.lineTo(w / 2, h)
      ctx.stroke()

      // Status
      ctx.fillStyle = "#9ca3af"
      ctx.font = `${Math.round(h * 0.03)}px system-ui`
      ctx.textAlign = "center"
      ctx.fillText(status, w / 2, h * 0.06)

      // === Left side: Joystick ===
      const jCx = w * 0.22
      const jCy = h * 0.5
      const jR = Math.min(w, h) * 0.18

      // Base
      ctx.beginPath()
      ctx.arc(jCx, jCy, jR, 0, Math.PI * 2)
      ctx.fillStyle = "#1e293b"
      ctx.fill()
      ctx.strokeStyle = "#334155"
      ctx.lineWidth = 2
      ctx.stroke()

      // Knob
      const knobR = jR * 0.38
      const knobActive = joystickTouch !== null
      ctx.beginPath()
      ctx.arc(jCx + joystickKnob.x, jCy + joystickKnob.y, knobR, 0, Math.PI * 2)
      ctx.fillStyle = knobActive ? "#3b82f6" : "#1d4ed8"
      ctx.fill()
      if (knobActive) {
        ctx.shadowColor = "#3b82f6"
        ctx.shadowBlur = 20
        ctx.fill()
        ctx.shadowBlur = 0
      }

      // Label
      ctx.fillStyle = "#475569"
      ctx.font = `${Math.round(h * 0.025)}px system-ui`
      ctx.textAlign = "center"
      ctx.fillText("MOVE", jCx, jCy + jR + h * 0.06)

      // === Right side: Gesture area ===
      const gCx = w * 0.75
      const gCy = h * 0.5

      // Gesture indicators
      const arrows = [
        { dir: "up", label: "↑ ATK 1", y: -1, x: 0 },
        { dir: "left", label: "← ATK 2", y: 0, x: -1 },
        { dir: "right", label: "ATK 3 →", y: 0, x: 1 },
        { dir: "down", label: "↓ ATK 4", y: 1, x: 0 },
      ]

      const spread = Math.min(w * 0.12, h * 0.18)
      ctx.font = `${Math.round(h * 0.03)}px system-ui`
      ctx.textAlign = "center"
      ctx.textBaseline = "middle"

      for (const a of arrows) {
        const ax = gCx + a.x * spread
        const ay = gCy + a.y * spread
        const active = lastGesture && lastGesture.type === a.dir && (performance.now() - lastGesture.time < 300)
        ctx.fillStyle = active ? "#3b82f6" : "#334155"
        ctx.fillText(a.label, ax, ay)
      }

      // Tap indicator (center)
      const tapActive = lastGesture && lastGesture.type === "tap" && (performance.now() - lastGesture.time < 300)
      const holdIndicator = holdActive
      ctx.fillStyle = tapActive ? "#22c55e" : holdIndicator ? "#16a34a" : "#475569"
      ctx.font = `bold ${Math.round(h * 0.035)}px system-ui`
      ctx.fillText(holdIndicator ? "HOLDING" : "TAP = JUMP", gCx, gCy)

      // Gesture area border hint
      ctx.strokeStyle = "#1e293b"
      ctx.lineWidth = 1
      ctx.setLineDash([5, 5])
      ctx.beginPath()
      ctx.arc(gCx, gCy, spread * 1.6, 0, Math.PI * 2)
      ctx.stroke()
      ctx.setLineDash([])

      requestAnimationFrame(draw)
    }
    requestAnimationFrame(draw)

    // === Networking ===
    const params = new URLSearchParams(window.location.search)
    const roomName = params.get("room")

    if (!roomName) {
      status = "No room. Scan QR to join."
    } else {
      startController(roomName)
    }

    async function startController(roomName) {
      const { joinRoom } = await import("https://esm.run/trystero@0.22.0")

      const room = joinRoom({ appId: "supermashbruddas-phone" }, roomName)
      const [sendInput, _receiveInput] = room.makeAction("input")
      _receiveInput(() => {})

      room.onPeerJoin(() => { status = "Connected ✓" })
      room.onPeerLeave(() => { status = "Host disconnected" })

      setInterval(() => {
        sendInput({ ...input })
      }, 33)
    }
  </script>
</body>
</html>
